      assert d['fresh_validation_failure_condition']
      assert d['next_bottleneck_reassessment_required'] is False
    else:
      assert d['candidate_mechanism'] is None
      assert d['next_bottleneck_reassessment_required'] is True
    print('direction_gate=',d['decision'])
