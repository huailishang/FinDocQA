# Generated by localagent-common/security-hooks/sync_ci_bundle.py. Do not edit manually.
name: Data Security Gate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  new-change-gate:
    name: New changes gate
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan every new commit
        run: python .github/security/security_scan.py audit-range "${{ steps.range.outputs.base }}" HEAD

  repository-baseline-audit:
    name: Baseline audit (non-blocking)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Scan current HEAD
        id: baseline
        continue-on-error: true
        run: python .github/security/security_scan.py audit-head

      - name: Summarize baseline result
        if: always()
        shell: bash
        run: |
          echo "### Data Security baseline audit" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.baseline.outcome }}" = "failure" ]; then
            echo "⚠️ Existing repository findings remain. They are tracked as baseline debt and do not block unrelated pushes." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Existing data-security findings remain in repository HEAD; clean them separately."
          else
            echo "✅ Current repository HEAD passed the full baseline audit." >> "$GITHUB_STEP_SUMMARY"
          fi
