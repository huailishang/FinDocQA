    import hashlib,json
    from pathlib import Path
    d=Path('handoffs/evaluator_executor/FDQA-B03-RESIDUAL-EVIDENCE-SUPPLY-DIRECTION-REASSESSMENT-V1')
    m=json.loads((d/'INPUT_MANIFEST.json').read_text(encoding='utf-8'))
    files=m['files']
    assert files and isinstance(files,dict)
    for p,expected in files.items():
      path=Path(p); assert path.is_file(), p
      assert hashlib.sha256(path.read_bytes()).hexdigest()==expected, p
    assert m['external_api_calls']==0 and m['model_calls']==0 and m['provider_calls']==0
    print('frozen_input_manifest=PASS')
  expected_exit_code: 0
  mandatory: true
