- id: VP-01
  ac: [AC-01]
  cwd: .
  command:
  - python3
  - -c
  - |
    import json,re
    from pathlib import Path
    h60=Path('handoffs/evaluator_executor/FDQA-B03-FRESH12-CLOUDFLARE-BOUNDED-WORKSPACE-CAPABILITY-V1')
    review=(h60/'REVIEW.md').read_text(encoding='utf-8')
    l3=json.loads((h60/'evidence/l3/L3-GATE.json').read_text(encoding='utf-8'))
    s=json.loads((h60/'BOUNDARY_CAPABILITY_SUMMARY.json').read_text(encoding='utf-8'))
    assert re.search(r'## Final verdict\s+PASS(?:\s|$)', review)
    assert 'capability_decision = NOT_QUALIFIED' in review
    assert l3['result']=='PASS' and l3['checks_total']==9 and l3['mandatory_failures']==0
    assert s['baseline_gold_reach_cases']==7 and s['candidate_gold_reach_cases']==9
    assert s['recovered_cases']==2 and s['recovered_document_families']==2 and s['protected_loss']==0
    assert s['qualified'] is False
    print('h60_final_authority=PASS')
  expected_exit_code: 0
  mandatory: true
- id: VP-02
