    p=Path('handoffs/evaluator_executor/FDQA-B03-RESIDUAL-EVIDENCE-SUPPLY-DIRECTION-REASSESSMENT-V1/DIRECTION_DECISION.json')
    d=json.loads(p.read_text(encoding='utf-8'))
    assert d['decision'] in {'CANDIDATE_DIRECTION','NO_SINGLE_DIRECTION'}
    if d['decision']=='CANDIDATE_DIRECTION':
      assert d['candidate_mechanism']
