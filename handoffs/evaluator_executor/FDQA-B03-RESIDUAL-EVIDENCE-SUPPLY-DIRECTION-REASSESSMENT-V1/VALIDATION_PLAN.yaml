- id: VP-07
  ac: [AC-07]
  cwd: .
  command:
  - python3
  - -c
  - |
    import subprocess
    from pathlib import Path
    task=Path('handoffs/evaluator_executor/FDQA-B03-RESIDUAL-EVIDENCE-SUPPLY-DIRECTION-REASSESSMENT-V1')
    forbidden=['API_ATTEMPT_LEDGER.jsonl','provider_ledger.jsonl','embedding_cache']
    assert not any((task/x).exists() for x in forbidden)
    rows=subprocess.check_output(['git','status','--porcelain'],text=True,encoding='utf-8',errors='replace').splitlines()
    product=[]
    for row in rows:
      p=row[3:].strip().strip('"').replace('\\','/')
      if p.startswith(('src/','config/','tests/')): product.append(p)
    assert product==[], product
    report=(task/'REPORT.md').read_text(encoding='utf-8')
    assert 'external_api_calls = 0' in report
    assert 'dependency_install_attempts = 0' in report
    print('zero_api_zero_product_change=PASS')
  expected_exit_code: 0
  mandatory: true
