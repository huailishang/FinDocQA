name: Data Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan every new commit
        run: python .github/security/security_scan.py audit-range "${{ steps.range.outputs.base }}" HEAD

      - name: Scan final HEAD
        run: python .github/security/security_scan.py audit-head
